# Tests and lint on every PR and on main. Required checks for main's ruleset:
# "lint", "test (ubuntu-latest, plain)", "test (ubuntu-latest, e2e)",
# "test (windows-latest, plain)" and "test (windows-latest, e2e)", all on
# Python 3.13. Nothing runs on the plugin's floor, 3.11; mypy and ruff check
# against it (docs/adr.md, 15).
# The two test modes run as separate jobs, and each runs its modules in
# parallel (pytest-xdist, docs/adr.md, 6): the Windows suite is slow.
# On Windows a step first turns Defender's real-time scanning off, with
# exclusions for the workspace, temp and Git as a fallback: a runner setting
# for speed only, since the suite starts thousands of short processes (#123).
# It never fails the job (docs/adr.md, 6).
# The tools (pytest, pytest-xdist, ruff, mypy, shellcheck) come from uv.lock,
# installed into .venv by `uv sync --locked` on the Python setup-python
# gives; uv never downloads one (docs/adr.md, 15).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Also in pyproject.toml; here too, since a variable set by an action or the
# runner image would override the file.
env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"   # as required-version in pyproject.toml
          require-checksums: true
          enable-cache: true
      - run: uv sync --locked
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
      - name: lint (ruff, mypy, shellcheck, LF line endings)
        run: bash scripts/dev-lint.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # windows: Git Bash
        mode: [plain, e2e]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"   # as required-version in pyproject.toml
          require-checksums: true
          enable-cache: true
      - run: uv sync --locked
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
      - name: Defender real-time scanning off (speed only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Never fails the job: Defender may be absent, or Tamper Protection
          # may block a setting. Each attempt prints what happened.
          $ErrorActionPreference = 'Continue'
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            Write-Host 'real-time monitoring: turned off'
          } catch {
            Write-Host "real-time monitoring: not turned off: $($_.Exception.Message)"
          }
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP)
          $git = Get-Command git -ErrorAction SilentlyContinue
          if ($git) { $paths += (Split-Path (Split-Path $git.Source -Parent) -Parent) }
          foreach ($p in ($paths | Where-Object { $_ } | Select-Object -Unique)) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "exclusion added: $p"
            } catch {
              Write-Host "exclusion not added: ${p}: $($_.Exception.Message)"
            }
          }
          try {
            $on = (Get-MpComputerStatus -ErrorAction Stop).RealTimeProtectionEnabled
            Write-Host "RealTimeProtectionEnabled: $on"
          } catch {
            Write-Host "Defender status unavailable: $($_.Exception.Message)"
          }
          exit 0
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: tests (${{ matrix.mode }})
        run: bash tests/run-tests.sh ${{ matrix.mode == 'e2e' && '--e2e' || '' }}
